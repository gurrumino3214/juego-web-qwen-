<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia de Cultura General</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f5f5ff;
        }

        .option-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        .next-btn.hidden {
            display: none;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .score {
            font-size: 3em;
            color: #667eea;
            margin: 20px 0;
        }

        .message {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }

        .quiz-container {
            display: block;
        }

        .quiz-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-container" id="quizContainer">
            <h1>🧠 Trivia de Cultura General</h1>
            <div class="progress">
                <span id="questionNumber">Pregunta 1 de 5</span>
                <span id="scoreDisplay">Puntos: 0</span>
            </div>
            <div class="question-container">
                <div class="question" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
            </div>
            <button class="next-btn hidden" id="nextBtn">Siguiente Pregunta</button>
        </div>

        <div class="result-container" id="resultContainer">
            <h1>¡Juego Terminado!</h1>
            <div class="score" id="finalScore"></div>
            <div class="message" id="resultMessage"></div>
            <button class="restart-btn" onclick="restartGame()">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "¿Cuál es el río más largo del mundo?",
                options: ["Nilo", "Amazonas", "Yangtsé", "Misisipi"],
                correct: 1
            },
            {
                question: "¿Quién pintó la Mona Lisa?",
                options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Miguel Ángel"],
                correct: 2
            },
            {
                question: "¿Cuál es el planeta más grande del sistema solar?",
                options: ["Saturno", "Júpiter", "Urano", "Neptuno"],
                correct: 1
            },
            {
                question: "¿En qué año llegó el hombre a la Luna?",
                options: ["1965", "1969", "1972", "1960"],
                correct: 1
            },
            {
                question: "¿Cuál es el país más grande del mundo por superficie?",
                options: ["China", "Estados Unidos", "Canadá", "Rusia"],
                correct: 3
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionNumber = document.getElementById('questionNumber');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const finalScore = document.getElementById('finalScore');
        const resultMessage = document.getElementById('resultMessage');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            questionText.textContent = q.question;
            questionNumber.textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
            scoreDisplay.textContent = `Puntos: ${score}`;
            
            optionsContainer.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            nextBtn.classList.add('hidden');
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = optionsContainer.children;

            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (i === q.correct) {
                    options[i].classList.add('correct');
                } else if (i === selectedIndex && selectedIndex !== q.correct) {
                    options[i].classList.add('incorrect');
                }
            }

            if (selectedIndex === q.correct) {
                score++;
            }

            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.style.display = 'block';
            finalScore.textContent = `${score}/${questions.length}`;
            
            if (score === 5) {
                resultMessage.textContent = "¡Perfecto! Eres un genio 🏆";
            } else if (score >= 3) {
                resultMessage.textContent = "¡Muy bien! Tienes buenos conocimientos 👍";
            } else {
                resultMessage.textContent = "Sigue practicando 📚";
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            resultContainer.style.display = 'none';
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        // Iniciar el juego
        loadQuestion();
    </script>
</body>
</html>
